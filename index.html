<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#063a3b">
    <meta name="description" content="Conheça o universo do Grupo VOLL: conhecimento, experiências e oportunidades para quem vive o Pilates.">
    <title>Grupo VOLL | Tudo do movimento</title>
    <link rel="preload" href="assets/manrope-variable.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="assets/logo-voll-pilates.webp" as="image" type="image/webp">
    <style>
      @font-face {
        font-family: "Manrope";
        src: url("assets/manrope-variable.ttf") format("truetype");
        font-style: normal;
        font-weight: 400 800;
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --color-deep: #06383a;
        --color-shadow: #042b30;
        --color-teal: #00a99e;
        --color-teal-light: #68dfca;
        --color-paper: #f3fffb;
        --color-muted: #c5e5de;
        --color-line: rgb(216 255 247 / 24%);
        --font-body: "Manrope", "Segoe UI", sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-width: 320px;
        background: var(--color-deep);
        scroll-behavior: smooth;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--color-deep);
        color: var(--color-paper);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection {
        background: var(--color-teal-light);
        color: var(--color-shadow);
      }

      :focus-visible {
        outline: 3px solid var(--color-teal-light);
        outline-offset: 5px;
      }

      .hero {
        position: relative;
        isolation: isolate;
        display: grid;
        min-height: 100svh;
        overflow: hidden;
        background: linear-gradient(115deg, var(--color-shadow) 0%, var(--color-deep) 47%, #025b56 100%);
      }

      .hero::before {
        position: absolute;
        z-index: -1;
        right: -25rem;
        bottom: -39rem;
        width: min(83vw, 78rem);
        aspect-ratio: 1;
        border: 1px solid rgb(214 255 247 / 9%);
        border-radius: 50%;
        content: "";
      }

      .hero::after {
        position: absolute;
        z-index: -1;
        right: -14rem;
        bottom: -28rem;
        width: min(64vw, 60rem);
        aspect-ratio: 1;
        border: 1px solid rgb(214 255 247 / 8%);
        border-radius: 50%;
        content: "";
      }

      .hero__shell {
        display: flex;
        width: min(100% - 8rem, 88rem);
        min-height: 100svh;
        flex-direction: column;
        justify-content: space-between;
        margin-inline: auto;
        padding-block: 2.25rem 1.5rem;
      }

      .site-header,
      .site-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        min-width: 0;
        align-items: center;
        gap: 1rem;
        color: inherit;
        text-decoration: none;
      }

      .brand__logo {
        display: block;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 50%;

      }

      .brand__name {
        font-size: 0.875rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .header-note {
        color: var(--color-muted);
        font-size: 0.75rem;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-align: right;
        text-transform: uppercase;
      }

      .hero__layout {
        display: grid;
        align-items: center;
        grid-template-columns: minmax(0, 1.18fr) minmax(20rem, 0.82fr);
        gap: clamp(3rem, 7vw, 8rem);
        padding-block: 3.25rem;
      }

      .hero__copy {
        max-width: 47rem;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        font-size: clamp(3.75rem, 7.1vw, 6.25rem);
        font-weight: 750;
        letter-spacing: -0.055em;
        line-height: 0.99;
        text-wrap: balance;
      }

      h1 span {
        color: var(--color-teal-light);
      }

      .hero__description {
        max-width: 40rem;
        margin: 1.75rem 0 0;
        color: var(--color-muted);
        font-size: clamp(1rem, 1.3vw, 1.2rem);
        font-weight: 450;
        line-height: 1.75;
        text-wrap: pretty;
      }

      .hero__cta {
        display: inline-flex;
        min-height: 3.75rem;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        margin-top: 2.25rem;
        padding: 0.9rem 1.25rem 0.9rem 1.5rem;
        border: 1px solid var(--color-paper);
        border-radius: 0.625rem;
        background: var(--color-paper);
        color: var(--color-deep);
        font-size: 0.9375rem;
        font-weight: 750;
        line-height: 1.2;
        text-decoration: none;
        transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
      }

      .hero__cta:hover {
        transform: translateY(-2px);
        border-color: var(--color-teal-light);
        background: var(--color-teal-light);
      }

      .hero__cta svg {
        width: 1.15rem;
        height: 1.15rem;
        flex: 0 0 auto;
      }

      .hero__visual {
        display: grid;
        min-width: 0;
        justify-items: center;
        gap: 1.65rem;
        margin: 0;
      }

      .orbit {
        position: relative;
        display: grid;
        width: min(100%, 28rem);
        aspect-ratio: 1;
        align-items: center;
        justify-items: center;
        border: 1px solid var(--color-line);
        padding: 1rem;
        border-radius: 50%;
      }

      .orbit::before,
      .orbit::after {
        position: absolute;
        aspect-ratio: 1;
        border: 1px solid var(--color-line);
        border-radius: 50%;
        content: "";
      }

      .orbit::before {
        inset: 9%;
        border-color: rgb(216 255 247 / 17%);
      }

      .orbit::after {
        inset: -9%;
        border-color: rgb(216 255 247 / 11%);
      }

      .orbit__logo {
        position: relative;
        z-index: 1;
        display: block;
        width: 51%;
        aspect-ratio: 1;
        border-radius: 50%;

      }

      .orbit__label {
        position: absolute;
        top: 8%;
        left: 50%;
        z-index: 2;
        padding-inline: 0.7rem;
        background: var(--color-deep);
        color: var(--color-teal-light);
        font-size: 0.625rem;
        font-weight: 750;
        letter-spacing: 0.2em;
        white-space: nowrap;
        transform: translateX(-50%);
      }

      .hero__signature {
        color: var(--color-paper);
        font-size: 0.875rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-align: center;
        text-transform: uppercase;
      }

      .site-footer {
        gap: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid rgb(216 255 247 / 19%);
        color: var(--color-muted);
        font-size: 0.75rem;
        font-weight: 550;
        letter-spacing: 0.025em;
      }

      .site-footer__phrase {
        color: var(--color-paper);
        font-weight: 700;
      }

      @media (max-width: 900px) {
        .hero__shell {
          width: min(100% - 4rem, 46rem);
        }

        .hero__layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 4rem;
          padding-block: 5rem;
        }

        .hero__copy {
          margin-inline: auto;
          text-align: center;
        }

        h1 {
          margin-inline: auto;
        }

        .hero__description {
          margin-inline: auto;
        }

        .orbit {
          width: min(67vw, 22rem);
        }
      }

      @media (max-width: 560px) {
        .hero__shell {
          width: min(100% - 2.5rem, 30rem);
          min-height: 100svh;
          padding-block: 1.25rem 1rem;
        }

        .brand {
          gap: 0.7rem;
        }

        .brand__logo {
          width: 3.5rem;
          height: 3.5rem;
        }

        .brand__name {
          font-size: 0.7rem;
          letter-spacing: 0.09em;
        }

        .header-note {
          max-width: 8.8rem;
          font-size: 0.625rem;
          line-height: 1.55;
        }

        .hero__layout {
          gap: 3.25rem;
          padding-block: 3.5rem;
        }

        h1 {
          font-size: clamp(3.375rem, 13.6vw, 4.25rem);
          line-height: 1;
        }

        .hero__description {
          margin-top: 1.35rem;
          font-size: 0.975rem;
          line-height: 1.7;
        }

        .hero__cta {
          margin-top: 1.65rem;
        }

        .orbit {
          width: min(66vw, 17rem);
        }

        .orbit__label {
          font-size: 0.5rem;
          letter-spacing: 0.14em;
        }

        .hero__signature {
          font-size: 0.75rem;
        }

        .site-footer {
          align-items: flex-start;
          font-size: 0.65rem;
          line-height: 1.6;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="landing">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__shell">
          <header class="site-header">
            <a class="brand" href="https://vollpilates.com.br/" aria-label="VOLL Pilates Group — página oficial">
              <img class="brand__logo" src="assets/logo-voll-pilates.webp" width="180" height="180" alt="">
              <span class="brand__name">Pilates Group</span>
            </a>
            <span class="header-note">Educação · Movimento · Evolução</span>
          </header>

          <div class="hero__layout">
            <div class="hero__copy">
              <h1 id="hero-title">Seu próximo<br><span>movimento</span><br>começa aqui.</h1>
              <p class="hero__description">Conhecimento, experiências e oportunidades para quem vive o universo do Pilates.</p>
              <a class="hero__cta" href="https://vollpilates.com.br/">
                <span>Conheça o Grupo VOLL</span>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M4.5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
              </a>
            </div>

            <figure class="hero__visual">
              <div class="orbit" aria-hidden="true">
                <span class="orbit__label">PILATES · MOVIMENTO · CONHECIMENTO</span>
                <img class="orbit__logo" src="assets/logo-voll-pilates.webp" width="180" height="180" alt="">
              </div>
              <figcaption class="hero__signature">Tudo do movimento</figcaption>
            </figure>
          </div>

          <footer class="site-footer">
            <span>VOLL Pilates Group</span>
            <span class="site-footer__phrase">Conectando pessoas ao movimento.</span>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
